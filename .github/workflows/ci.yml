# CI for Bragi (specs/13-agent-guide.md §6).
#
# NOT THE GATE. Bragi is a solo project and verification is local: `pnpm verify`
# plus `pnpm infra:up` (13 §4, §6). This workflow is kept ready and correct for
# the day the project wants hosted CI — it mirrors `pnpm verify` and the e2e
# suites across Ubuntu, macOS and Windows — but no run has been required or
# observed, so treat a first run as unproven. The desktop e2e jobs in particular
# have never been executed (WP-0.5 could only run macOS; see Q11). Later work
# packages would add engine conformance, visual regression, integration and the
# quality evals.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  typescript:
    name: TypeScript (${{ matrix.os }})
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  # Generated code is checked in its own job because `pnpm schemas:check` regenerates all three
  # languages, so it needs pnpm, cargo and uv. The local gate is `pnpm verify`, which runs it first.
  schemas:
    name: Generated code is up to date
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
        working-directory: services/workers
      - run: pnpm schemas:check

  lint-typescript:
    name: Lint TypeScript
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Biome formatting and lint, plus the repository layout guard for 01 §4.
      - run: pnpm lint

  web-e2e:
    name: Web e2e (Chromium, Firefox, WebKit)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The packages the web build consumes (@bragi/app, @bragi/platform) must be
      # built first; `playwright test` starts `vite dev` and `vite preview`
      # itself, and asserts crossOriginIsolated on both.
      - run: pnpm build
      - run: pnpm --filter @bragi/web exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  desktop-e2e-linux:
    name: Desktop e2e (Linux)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # WebKitGTK and friends, which the Tauri app links against (01 §3).
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential curl wget file xvfb
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # The harness builds the web bundle, the driver bundle and the app with
      # `--features selftest`, then runs it twice against one data directory.
      # There is no display on the runner, so it runs under Xvfb.
      - run: xvfb-run -a pnpm test:e2e:desktop

  desktop-e2e-windows:
    name: Desktop e2e (Windows)
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # WebView2 is preinstalled on the runner image (01 §3).
      - run: pnpm test:e2e:desktop

  rust:
    name: Rust (${{ matrix.os }})
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the channel, components and the wasm32 target,
      # and rustup on the runner honours it.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  lint-rust:
    name: Lint Rust & wasm32 build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # Every library crate must build for the browser except the *-native one
      # (13 §3).
      - run: cargo build --target wasm32-unknown-unknown -p bragi-model -p bragi-dsp -p bragi-engine -p bragi-engine-wasm

  python:
    name: Python
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/workers
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes point tags only: there is no moving `v10`.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          # Matches services/workers/.python-version, which is what `uv sync`
          # itself reads; this makes the runner provision the same interpreter.
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest

  infra:
    name: Infrastructure
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose up (waits for healthy)
        run: docker compose -f infra/docker-compose.yml up -d --wait --wait-timeout 180
      - name: Services do what the specs need
        run: |
          set -euo pipefail
          # pgvector and pgcrypto, and the vector type is usable (01 §1, 05 §5).
          docker compose -f infra/docker-compose.yml exec -T postgres \
            psql -U bragi -d bragi -tAc "select '[1,2,3]'::vector <-> '[1,2,4]'::vector" | grep -q 1
          # The blob bucket exists and is private (05 §6). The MinIO image ships
          # no grep, so the matching happens here on the runner.
          minio=$(docker compose -f infra/docker-compose.yml exec -T minio sh -c \
            'mc alias set ci http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null \
             && mc ls ci && mc anonymous get ci/bragi-blobs')
          echo "$minio"
          echo "$minio" | grep -q bragi-blobs
          echo "$minio" | grep -q private
          # NATS JetStream is enabled (05 §4).
          curl -sf http://127.0.0.1:8222/healthz | grep -q ok
          curl -sf "http://127.0.0.1:8222/jsz?config=1" | grep -q store_dir
          # Mailpit answers, so magic-link email works locally (05 §8).
          curl -sf http://127.0.0.1:8025/api/v1/info | grep -q Version
      - name: Service logs
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
