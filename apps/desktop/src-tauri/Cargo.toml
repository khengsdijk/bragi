[package]
name = "bragi-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Bragi desktop shell: Tauri 2 process hosting the local database and blob cache"
build = "build.rs"

[lib]
name = "bragi_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

# `selftest` compiles the end-to-end harness in (see src/selftest.rs). It is off
# in every normal build, including the bundled release.
#
# `custom-protocol` is what makes the built app serve the embedded
# `frontendDist` instead of pointing the webview at `build.devUrl`
# (tauri::is_dev()). `tauri dev` builds this crate with `--no-default-features`,
# which is how the dev server gets used; every other build — including
# `cargo build --features selftest`, which the desktop harness runs — must have
# it on, or the webview looks for a dev server that is not there.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
selftest = []

[dependencies]
bragi-engine-native = { path = "../../../crates/bragi-engine-native" }
bragi-model = { path = "../../../crates/bragi-model" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tauri = { version = "2.12.4", features = [] }

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[lints]
workspace = true
