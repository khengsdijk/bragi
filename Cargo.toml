[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false
repository = "https://github.com/khengsdijk/bragi"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regress = "0.12"
# Codegen only (crates/bragi-schemas-codegen), which is why they are not in the
# runtime crates; see specs/decisions/ADR-0006-schema-codegen.md.
typify = "0.8"
schemars = "0.8"
syn = { version = "2", features = ["full"] }
prettyplease = "0.2"

# Lints apply to every crate via `[lints] workspace = true`.
# CI runs `cargo clippy --workspace --all-targets -- -D warnings`, so these
# warnings are errors there.
[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# specs/13-agent-guide.md §3: no unwrap() outside tests. Test modules opt out
# explicitly with #[allow(clippy::unwrap_used)].
unwrap_used = "warn"
expect_used = "warn"
# The audio thread is sacred (specs/13-agent-guide.md §1): no panics, no I/O.
panic = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

# NOTE for WP-1.1: bragi-dsp and bragi-engine will need optimised debug builds,
# because the conformance tests run in debug. `[profile.dev.package."*"]` does
# NOT do that — Cargo applies it to non-workspace members only — so WP-1.1 picks
# the shape it needs (per-crate overrides, or `[profile.dev] opt-level`).

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
