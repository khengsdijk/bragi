# Local development infrastructure (specs/01-architecture.md §8).
#
#   pnpm infra:up     start the infrastructure, wait for healthy
#   pnpm infra:logs   follow logs
#   pnpm infra:down   stop and delete the volumes
#
# The API, orchestrator and CPU workers are the `api` and `worker` services
# below (WP-0.7); `jaeger` is local-only trace storage so the OpenTelemetry trace
# from API → NATS → worker is visible (specs/05 §11). Bring up only what you
# need and never tear down the shared infrastructure:
#
#   docker compose -f infra/docker-compose.yml up -d --wait postgres minio nats mailpit
#   docker compose -f infra/docker-compose.yml up -d --build api worker jaeger
#
# Everything binds to 127.0.0.1: none of this is reachable from the network.

name: bragi

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bragi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bragi}
      POSTGRES_DB: ${POSTGRES_DB:-bragi}
      # Deterministic collation, so ORDER BY matches between machines.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h forces TCP. Without it pg_isready answers over the Unix socket, where
      # the entrypoint's temporary init server also listens, so the service would
      # report healthy before postgres/init/*.sql had run.
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-bragi} -d ${POSTGRES_DB:-bragi}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  minio:
    # MinIO no longer publishes dated RELEASE tags for anonymous pulls on Docker
    # Hub, so this is the one tag available; `docker manifest inspect` is also
    # denied anonymously, which rules out a verified digest pin. Known-good
    # digest at the time of WP-0.1:
    #   sha256:a616cd8f37758b0296db62cc9e6af05a074e844cc7b5c0a0e62176d73828d440
    #   (minio RELEASE.2025-05-24T17-08-30Z, mc RELEASE.2025-04-16T18-13-26Z)
    # Production uses real S3 (01 §1), so this floats only in local dev.
    image: minio/minio:latest
    restart: unless-stopped
    # MinIO turns every top-level directory under its data root into a bucket, so
    # creating the directory *is* bucket provisioning (05 §6) — no init container,
    # which would make `up --wait` exit non-zero when it finished. Blobs are never
    # publicly readable, and private is MinIO's default policy.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mkdir -p "/data/${MINIO_BUCKET:-bragi-blobs}" && exec minio server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bragi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bragi-dev-secret}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  nats:
    image: nats:2.15.1-alpine
    restart: unless-stopped
    # -js: JetStream (durable job queues and events, 05 §4).
    # -m:  HTTP monitoring, which is also the health endpoint.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITORING_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Catches magic-link email locally (Better Auth, 05 §8). Web UI on :8025.
  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Local trace store (05 §11). OTLP/HTTP on :4318, trace UI/query on :16686.
  # Dev-only and in-memory: restarting loses traces, which is fine for local runs.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${JAEGER_OTLP_PORT:-4318}:4318"
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:14269/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # api-http + api-orchestrator (05 §1). Built from the repository root.
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8080
      PUBLIC_URL: http://127.0.0.1:${API_PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-bragi}:${POSTGRES_PASSWORD:-bragi}@postgres:5432/${POSTGRES_DB:-bragi}
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${MINIO_BUCKET:-bragi-blobs}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-bragi}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-bragi-dev-secret}
      SMTP_URL: smtp://mailpit:1025
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-insecure-auth-secret-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_SERVICE_NAME: bragi-api
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # CPU workers (05 §1). Runs `echo` today; analysis capabilities join in WP-1.2+.
  worker:
    build:
      context: ..
      dockerfile: services/workers/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bragi}:${POSTGRES_PASSWORD:-bragi}@postgres:5432/${POSTGRES_DB:-bragi}
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${MINIO_BUCKET:-bragi-blobs}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-bragi}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-bragi-dev-secret}
      WORKER_NAME: ${WORKER_NAME:-bragi-worker}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_SERVICE_NAME: bragi-worker

volumes:
  postgres-data:
  minio-data:
  nats-data:
