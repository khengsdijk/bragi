[package]
name = "bragi-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
bragi-model = { path = "../bragi-model" }
bragi-dsp = { path = "../bragi-dsp" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# One decoder for native and wasm (specs/01-architecture.md §1). Optional so a
# host that only mixes pre-decoded PCM does not carry it.
symphonia = { workspace = true, optional = true }
# Per-track parallel stem export. Native only; the wasm build leaves it off.
rayon = { workspace = true, optional = true }

[features]
default = []
# Enables `bragi_engine::decode` (symphonia): FLAC/WAV/MP3/AAC/OGG/M4A to
# interleaved f32. Both hosts enable it.
decode = ["dep:symphonia"]
# Renders stems on the rayon pool (03 §3.2). Enabled by bragi-engine-native only.
parallel = ["dep:rayon"]

[dev-dependencies]
# The export tests decode what they encode, so they need the decoder.
bragi-engine = { path = ".", features = ["decode"] }
proptest.workspace = true
insta.workspace = true

[lints]
workspace = true
