# The WP-0.4 stretch lab: fixture generator, listening renders, benchmarks and the
# AudioWorklet test page. It is its own Cargo workspace on purpose, so the comparison
# candidates it builds (Signalsmith Stretch needs a C++ compiler and libclang) never
# become requirements of `pnpm verify`. Nothing in here ships. See README.md.
[workspace]
resolver = "3"
members = ["lab", "worklet"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
debug = false
