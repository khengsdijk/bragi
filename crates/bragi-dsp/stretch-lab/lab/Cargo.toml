[package]
name = "stretch-lab"
description = "WP-0.4 stretch spike: fixtures, listening renders, benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["signalsmith"]
# Signalsmith Stretch via the C++ library (needs a C++ compiler and libclang for bindgen).
signalsmith = ["dep:signalsmith-stretch"]

[dependencies]
bragi-dsp = { path = "../.." }
signalsmith-stretch = { version = "=0.1.3", optional = true }
timestretch = "=0.15.0"
cute-dsp = { version = "=0.0.41", default-features = false, features = ["std"] }
