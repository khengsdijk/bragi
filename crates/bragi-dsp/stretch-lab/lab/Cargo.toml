[package]
name = "stretch-lab"
description = "WP-0.4 stretch spike: fixtures, listening renders, benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Nothing is on by default: `cargo run -p stretch-lab --bin gen-fixtures` must build with only
# `bragi-dsp`. The comparison candidates are opt-in so their toolchains (a C++ compiler and
# libclang for Signalsmith) are never a requirement of a plain build.
default = []
# Signalsmith Stretch via the C++ library (needs a C++ compiler and libclang for bindgen).
signalsmith = ["dep:signalsmith-stretch"]
# Other pure-Rust stretch engines, for the ADR comparison table.
compare = ["dep:timestretch", "dep:cute-dsp"]

[[bin]]
name = "compare"
path = "src/bin/compare.rs"
required-features = ["signalsmith"]

[dependencies]
bragi-dsp = { path = "../.." }
signalsmith-stretch = { version = "=0.1.3", optional = true }
timestretch = { version = "=0.15.0", optional = true }
cute-dsp = { version = "=0.0.41", optional = true, default-features = false, features = ["std"] }
