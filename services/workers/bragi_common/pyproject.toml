[project]
name = "bragi-common"
version = "0.0.0"
description = "Shared worker framework: NATS client, job protocol, S3 helpers, generated models"
requires-python = ">=3.12"
dependencies = [
  # Pydantic v2 models generated from packages/schemas (01 §7, WP-0.2).
  "pydantic>=2.11",
  # Configuration from the environment, validated at boot (01 §8).
  "pydantic-settings>=2.7",
  # Job queue and events (05 §4).
  "nats-py>=2.9",
  # Content-addressed input/output IO (05 §6).
  "boto3>=1.35",
  # The result cache in Postgres (05 §4.3).
  "asyncpg>=0.30",
  # OpenTelemetry from API through NATS to worker (05 §11).
  "opentelemetry-api>=1.30",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bragi_common"]
