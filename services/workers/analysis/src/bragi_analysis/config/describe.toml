# Configuration for the `describe` capability (specs/04-analysis-pipeline.md §6.3, WP-1.7).
#
# model is the OpenRouter model slug (vendor/model). It lives here, not in code (specs/06 §4: model IDs are configuration).
# Override it with BRAGI_DESCRIBE_MODEL or the job param `model`. The default is a cheap model with JSON-mode support, chosen by the owner
# on 2026-10-19 (Q71, ADR-0012).
#
# blockedTerms are names the description must never contain (specs/10 §7, no artist imitation by
# name). The curated list is not in the repo yet (Q74), so v1 ships it empty.
#
# maxTokens bounds one reply. A description is a short JSON object, so this is generous.

model = "deepseek/deepseek-v4.1-flash"
maxTokens = 2048
blockedTerms = []
