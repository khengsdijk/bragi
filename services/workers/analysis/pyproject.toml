[project]
name = "bragi-analysis"
version = "0.0.0"
description = "Analysis workers: ingest, separate, rhythm, harmony, structure, tag, describe"
requires-python = ">=3.12"
dependencies = [
  "bragi-common",
  # DSP for loudness, onset features, the weight-free beat tracker and the separation pipeline
  # (resampling, chunk stitching) (BSD-3-Clause).
  "numpy>=2.0",
  "scipy>=1.14",
  # 24-bit FLAC IO for separation (BSD-3-Clause; bundles LGPL-2.1 libsndfile, dynamically linked).
  "soundfile>=0.13",
  "pyyaml>=6.0",
  # Beat F-measure for the eval gate (04 §8) (MIT).
  "mir_eval>=0.8",
]

[project.optional-dependencies]
# The neural beat tracker (ADR-0007). Not installed by default so that the CPU
# gate (`pnpm verify`) stays fast; the worker image installs it with `--extra ml`.
# torch + demucs for separation live in the root `models` group (WP-1.3, ADR-0004).
ml = [
  "torch>=2.2",
  "beat-this>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bragi_analysis"]
# The pinned-weights lock file ships with the package (read at image build and at load time).
artifacts = ["src/bragi_analysis/separation/models_lock.json"]

[tool.uv.sources]
bragi-common = { workspace = true }

