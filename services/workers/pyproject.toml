# uv workspace root for the Bragi Python workers (specs/01-architecture.md §4).
# This is a virtual root: it builds nothing, it only ties the members together
# and holds the shared tool configuration.

[project]
name = "bragi-workers"
version = "0.0.0"
description = "Bragi ML workers: analysis, embedding and generation"
requires-python = ">=3.12"
dependencies = [
  "bragi-common",
  "bragi-analysis",
  "bragi-embed",
  "bragi-generate",
]

[project.optional-dependencies]
# The neural models (torch, beat-this). Not part of the default sync so that the
# CPU gate stays fast; `uv run --extra ml` / `uv sync --extra ml` adds them (ADR-0007).
ml = ["bragi-analysis[ml]"]

[tool.uv]
package = false
# `models` (torch + demucs) is large and only needed to run real separation, so it is not
# synced by default: `uv sync` stays fast and `pnpm verify` needs no weights or GPU.
# The worker image and the weights-backed tests use `uv sync --group models`.
default-groups = ["dev"]
# Intel Macs are not a supported worker platform: demucs pins torch<2.3 and numpy<2 there, which
# would hold every other platform back to torch 2.2. Apple silicon, Linux and Windows are covered.
environments = [
  "sys_platform == 'linux'",
  "sys_platform == 'win32'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.workspace]
members = ["bragi_common", "analysis", "embed", "generate"]

[tool.uv.sources]
bragi-common = { workspace = true }
bragi-analysis = { workspace = true }
bragi-embed = { workspace = true }
bragi-generate = { workspace = true }

[dependency-groups]
dev = [
  "mypy>=1.19",
  "pytest>=9.0",
  "ruff>=0.15",
  # Generates bragi_common/src/bragi_common/generated/models.py from the JSON Schemas
  # (WP-0.2). Dev-only: the generated models are committed and imported at runtime.
  "datamodel-code-generator>=0.85",
]

# Real separation (WP-1.3, ADR-0004): needs torch (CPU, MPS or CUDA) and demucs (MIT).
models = [
  "torch>=2.1",
  "demucs>=4.1.0",
]

# --- Tooling (specs/13-agent-guide.md §3) -----------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["bragi_common/src", "analysis/src", "embed/src", "generate/src"]
# `pnpm schemas:gen` writes these files from packages/schemas; they are never hand-edited
# (13 §1), and their field names deliberately mirror the JSON (mixedCase), so linting them
# would mean linting the schemas. Regenerate with `pnpm schemas:gen`.
extend-exclude = ["bragi_common/src/bragi_common/generated"]

[tool.ruff.lint]
select = [
  "F",   # pyflakes
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "I",   # import sorting
  "N",   # pep8-naming
  "D",   # pydocstyle
  "UP",  # pyupgrade
  "ANN", # missing annotations
  "S",   # flake8-bandit
  "B",   # flake8-bugbear
  "A",   # builtin shadowing
  "C4",  # comprehensions
  "PT",  # pytest style
  "SIM", # simplify
  "TID", # tidy imports
  "RUF", # ruff-specific
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S603", "S607", "D", "ANN", "PT018", "RUF007"] # asserts, docstrings and annotations are not required in tests

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
# Model-heavy worker code may be relaxed per package (13 §3: "models may be
# looser"); bragi_common always stays strict.
exclude = ['^\.venv/']

# Vendored C-extension clients ship no stubs. They are used through a thin
# adapter (bragi_common.s3, bragi_common.cache), so the untyped edge is contained
# to those two modules rather than spreading through the framework.
[[tool.mypy.overrides]]
module = [
  "asyncpg", "asyncpg.*", "boto3", "boto3.*", "botocore", "botocore.*",
  # Separation (WP-1.3): torch/demucs are optional (the `models` group) and untyped at the edge.
  "torch", "torch.*", "demucs", "demucs.*", "soundfile", "scipy", "scipy.*", "yaml",
]
ignore_missing_imports = true
# Untyped third-party libraries used by the analysis workers (13 §3: models may
# be looser than bragi_common).

[[tool.mypy.overrides]]
module = ["scipy.*", "mir_eval.*", "torch.*", "beat_this.*", "transformers", "transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
markers = [
  "weights: needs real model weights; skipped by default (Beat This!: BRAGI_TEST_WEIGHTS=1; separation: BRAGI_MODELS_DIR + the `models` group) (04 §9)",
]
testpaths = [
  "bragi_common/tests",
  "analysis/tests",
  "embed/tests",
  "generate/tests",
]
